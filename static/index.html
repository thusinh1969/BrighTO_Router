<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrighTO Router</title>
<style>
:root{
  --bg:#0e0e12; --bg2:#15151b; --panel:#1a1a21; --panel2:#20202a; --border:#2c2c38;
  --text:#e7e7ee; --muted:#9a9ab0; --faint:#6b6b80;
  --accent:#7c6cf0; --accent2:#a78bfa; --green:#34d399; --red:#f87171; --amber:#fbbf24; --cyan:#22d3ee;
  --radius:12px; --shadow:0 8px 30px rgba(0,0,0,.45);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#1c1830 0%,var(--bg) 55%);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent2);text-decoration:none}
.hidden{display:none!important}
code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:12px;color:var(--accent2)}
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:36px 32px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex:0 0 auto}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
.subtitle{color:var(--muted);margin:2px 0 26px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:10px 12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.active{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);padding:10px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#6b5ce0}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
#app-view{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:0 0 auto}
.sidebar .brand{padding:0 8px 18px;border-bottom:1px solid var(--border);margin-bottom:10px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--muted);
  cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:.12s}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.active{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.nav svg{width:17px;height:17px;flex:0 0 auto;opacity:.8}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:700}
.sidebar .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.mode-pill{font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:99px;
  padding:4px 10px;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.main{flex:1;padding:28px 34px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.topbar h2{font-size:22px;margin:0;letter-spacing:-.02em}
.topbar .desc{color:var(--muted);font-size:13px;margin-top:2px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card h3{font-size:15px;margin:0 0 6px}
.card .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.card .muted{color:var(--muted);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.panel h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.panel-head h3{margin:0}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
td.mono{font-family:var(--mono);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill .dot{width:6px;height:6px;border-radius:50%}
.pill.on{background:rgba(52,211,153,.12);color:var(--green)} .pill.on .dot{background:var(--green)}
.pill.off{background:rgba(248,113,113,.12);color:var(--red)} .pill.off .dot{background:var(--red)}
.pill.warn{background:rgba(251,191,36,.12);color:var(--amber)} .pill.warn .dot{background:var(--amber)}
.pill.info{background:rgba(34,211,238,.12);color:var(--cyan)} .pill.info .dot{background:var(--cyan)}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;z-index:50;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;
  padding:24px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:99px;
  padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text)}
.chip.selected{border-color:var(--accent);background:rgba(124,108,240,.14);color:var(--accent2)}
.chip input{margin:0;accent-color:var(--accent)}
#toast{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;
  padding:12px 16px;font-size:13px;box-shadow:var(--shadow);max-width:360px;animation:slide .2s ease}
.toast.ok{border-left-color:var(--green)} .toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{color:var(--faint);text-align:center;padding:36px 16px;font-size:13px}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.4}
.key-reveal{background:var(--bg2);border:1px dashed var(--accent);border-radius:10px;padding:14px;margin:14px 0;
  font-family:var(--mono);font-size:14px;word-break:break-all;color:var(--accent2)}
.warn-note{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:var(--amber);border-radius:8px;
  padding:10px 12px;font-size:12px;margin:10px 0}
.hamburger{display:none}
@media(max-width:820px){.hamburger{display:inline-flex}.sidebar{position:fixed;z-index:40;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none}.main{padding:20px}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="login-view">
  <div class="login-card">
    <div class="brand"><div class="logo">B</div><h1>BrighTO Router</h1></div>
    <div class="subtitle">Manage providers, model routes, teams, keys and usage — all in one place.</div>
    <div class="seg">
      <button id="seg-admin" class="active" onclick="setMode('admin')">Admin</button>
      <button id="seg-user" onclick="setMode('user')">User</button>
    </div>
    <div class="hint" id="login-mode-desc" style="margin:0 0 14px"></div>
    <div class="field">
      <label id="login-label">Admin master key</label>
      <input id="login-key" type="password" placeholder="brightoIsGreat@2026" autocomplete="off">
    </div>
    <button class="btn primary btn-block" onclick="login()">Sign in</button>
    <div class="warn-note hidden" id="login-error"></div>
    <div class="hint" style="margin-top:14px">
      Admin key is set via <code>ADMIN_MASTER_KEY</code>. A User signs in with their client API key
      (<code>Bearer</code>) to see only their own usage, charts and logs.
    </div>
  </div>
</div>

<div id="app-view" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">B</div><h1 style="font-size:16px">BrighTO</h1></div>
    <button class="nav active" data-view="dashboard" onclick="go('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></svg>Dashboard</button>
    <button class="nav" data-view="models" onclick="go('models')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5-9 5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/></svg>Models</button>
    <button class="nav" data-view="providers" onclick="go('providers')" id="nav-providers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Providers</button>
    <button class="nav" data-view="teams" onclick="go('teams')" id="nav-teams">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Teams</button>
    <button class="nav" data-view="keys" onclick="go('keys')" id="nav-keys">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zM15 6l3 3m-1-4l3 3"/></svg>API Keys</button>
    <button class="nav" data-view="usage" onclick="go('usage')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-7"/></svg>Usage</button>
    <button class="nav" data-view="logs" onclick="go('logs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>Logs</button>
    <div class="foot">
      <div class="mode-pill" id="mode-pill">Admin</div>
      <button class="btn ghost sm" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn sm ghost hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div><h2 id="page-title">Dashboard</h2><div class="desc" id="page-desc"></div></div>
      <div class="row"><button class="btn sm" onclick="refresh()">Refresh</button></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="modal-overlay" class="hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
"use strict";
var mode = "admin";
var authKey = "";
var backends = [];
var routes = [];
var teams = [];
var keys = [];
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; }
function fmt(n){ if(n===null||n===undefined)return "-"; return Number(n).toLocaleString(); }
function fmtTs(sec){ if(!sec)return "-"; var d=new Date(sec*1000); return d.toISOString().replace("T"," ").slice(0,19); }
function fmtDate(sec){ var d=new Date(sec*1000); return d.toISOString().slice(0,10); }
function authHeaders(){
  if(mode === "admin"){ return {"Content-Type":"application/json","x-admin-key":authKey}; }
  return {"Content-Type":"application/json","Authorization":"Bearer "+authKey};
}
async function api(path, method, body){
  var res = await fetch(path, {method:method, headers:authHeaders(), body:body?JSON.stringify(body):undefined});
  if(!res.ok){
    var text = await res.text();
    var msg = text;
    try { var j = JSON.parse(text); if(j.error) msg = j.error.message || j.error; } catch(e){}
    throw new Error(res.status + " " + msg);
  }
  if(res.status === 204) return null;
  return res.json();
}
function toast(msg, type){
  var box = $("toast");
  var t = el("div","toast "+(type||""), msg);
  box.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4000);
}
function setMode(m){
  mode = m;
  $("seg-admin").classList.toggle("active", m==="admin");
  $("seg-user").classList.toggle("active", m==="user");
  $("login-label").textContent = m==="admin" ? "Admin master key" : "Your API key";
  $("login-key").placeholder = m==="admin" ? "brightoIsGreat@2026" : "lc-... or Bearer key";
  $("login-mode-desc").textContent = m==="admin"
    ? "Admin — full control: manage providers, model routes, teams, API keys and view all usage."
    : "User — view-only: see your own key, team, usage charts and request logs.";
}
async function login(){
  authKey = $("login-key").value.trim();
  var err = $("login-error");
  err.classList.add("hidden");
  if(!authKey){ err.textContent = "Please enter a key."; err.classList.remove("hidden"); return; }
  try{
    if(mode === "admin"){ await api("/admin/backends","GET"); }
    else { await api("/portal/me","GET"); }
  }catch(e){
    err.textContent = "Sign-in failed: " + e.message;
    err.classList.remove("hidden");
    return;
  }
  $("login-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  $("mode-pill").textContent = mode === "admin" ? "Admin" : "User · " + (authKey.slice(0,8) || "");
  ["providers","teams","keys","models"].forEach(function(v){
    var n = $("nav-"+v);
    if(n) n.style.display = mode==="admin" ? "" : "none";
  });
  await refresh();
}
function logout(){
  authKey = "";
  $("app-view").classList.add("hidden");
  $("login-view").classList.remove("hidden");
  $("content").innerHTML = "";
}
var titles = {dashboard:"Dashboard",models:"Models",providers:"Providers",teams:"Teams",keys:"API Keys",usage:"Usage",logs:"Request Logs"};
var descs = {
  dashboard:"Overview of your gateway",
  models:"Model routes → provider backends",
  providers:"Provider backends and API keys",
  teams:"Teams and budgets",
  keys:"Client API keys",
  usage:"Token usage charts",
  logs:"Recent requests"
};
function go(view){
  document.querySelectorAll(".nav").forEach(function(n){ n.classList.toggle("active", n.dataset.view===view); });
  $("page-title").textContent = titles[view];
  $("page-desc").textContent = descs[view];
  render(view);
}
async function refresh(){
  try{
    if(mode==="admin"){
      backends = await api("/admin/backends","GET");
      routes = await api("/admin/routes","GET");
      teams = await api("/admin/teams","GET");
      keys = await api("/admin/keys","GET");
    }
    var cur = document.querySelector(".nav.active");
    if(cur) render(cur.dataset.view);
    else go("dashboard");
  }catch(e){ toast("Load failed: "+e.message,"err"); }
}
function render(view){
  var c = $("content");
  c.innerHTML = "";
  if(mode === "user" && ["models","providers","teams","keys"].indexOf(view)>=0){ view = "dashboard"; }
  if(view==="dashboard") renderDashboard(c);
  else if(view==="models") renderModels(c);
  else if(view==="providers") renderProviders(c);
  else if(view==="teams") renderTeams(c);
  else if(view==="keys") renderKeys(c);
  else if(view==="usage") renderUsage(c);
  else if(view==="logs") renderLogs(c);
}
function emptyBox(text){
  var d = el("div","empty");
  d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
  d.appendChild(document.createTextNode(text));
  return d;
}
async function renderDashboard(c){
  var stats = [];
  try{
    var path = mode==="admin" ? "/admin/stats?days=30" : "/portal/me/stats?days=30";
    stats = await api(path,"GET");
  }catch(e){ stats = []; }
  var totalIn = stats.reduce(function(a,s){return a + s.input_tokens},0);
  var totalOut = stats.reduce(function(a,s){return a + s.output_tokens},0);
  var totalReq = stats.reduce(function(a,s){return a + s.requests},0);
  var cards = [];
  if(mode==="admin"){
    cards = [
      ["Providers", backends.length, backends.filter(function(b){return b.enabled}).length + " enabled"],
      ["Models", routes.length, "routes configured"],
      ["Teams", teams.length, teams.filter(function(t){return t.enabled}).length + " enabled"],
      ["API keys", keys.length, keys.filter(function(k){return k.enabled}).length + " active"]
    ];
  }
  cards = cards.concat([
    ["Requests (30d)", totalReq, "completed"],
    ["Input tokens (30d)", fmt(totalIn), "total"],
    ["Output tokens (30d)", fmt(totalOut), "total"]
  ]);
  var grid = el("div","grid");
  cards.forEach(function(card){
    var cardEl = el("div","card");
    cardEl.appendChild(el("div","muted", card[0]));
    cardEl.appendChild(el("div","big", card[1]));
    cardEl.appendChild(el("div","muted", card[2]));
    grid.appendChild(cardEl);
  });
  c.appendChild(grid);
  var panel = el("div","panel");
  var head = el("div","panel-head");
  head.appendChild(el("h3",null,"Tokens by model — last 30 days"));
  panel.appendChild(head);
  if(stats.length){ panel.appendChild(chartBars(stats)); }
  else { panel.appendChild(emptyBox("No usage yet. Make a request through the router to see charts.")); }
  c.appendChild(panel);
  if(mode==="admin"){
    var p2 = el("div","panel");
    var h2 = el("div","panel-head");
    h2.appendChild(el("h3",null,"Recent requests"));
    p2.appendChild(h2);
    p2.appendChild(await logsTable(null));
    c.appendChild(p2);
  }
}
function renderModels(c){
  var panel = el("div","panel");
  var head = el("div","panel-head");
  head.appendChild(el("h3",null,"Model routes"));
  var add = el("button","btn primary sm","New route");
  add.onclick = openRouteModal;
  head.appendChild(add);
  panel.appendChild(head);
  panel.appendChild(el("p","hint","A route maps a client-facing model name to one or more provider backends."));
  if(!routes.length){ panel.appendChild(emptyBox("No routes yet. Click “New route”.")); }
  else{
    var wrap = el("div","table-wrap");
    var t = el("table");
    t.appendChild(thead(["Model","Backends","Fallback","Timeout",""]));
    var tb = el("tbody");
    routes.forEach(function(r){
      var tr = el("tr");
      tr.appendChild(el("td","mono", r.model_name));
      tr.appendChild(el("td",null, r.backend_ids.join(", ")));
      tr.appendChild(el("td",null, r.fallback_backend_id===null?"—":String(r.fallback_backend_id)));
      tr.appendChild(el("td",null, r.first_byte_timeout+"s"));
      var td = el("td");
      var b = el("button","btn sm ghost","Edit");
      b.onclick = function(){ openRouteModal(r); };
      td.appendChild(b);
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    wrap.appendChild(t);
    panel.appendChild(wrap);
  }
  c.appendChild(panel);
}
function openRouteModal(route){
  route = route || {};
  var overlay = $("modal-overlay");
  overlay.innerHTML = "";
  var m = el("div","modal");
  m.appendChild(el("h3",null, route.model_name ? "Edit route" : "Create route"));
  var f = el("div","field");
  f.appendChild(el("label",null,"Model name"));

function chartBars(stats){
  var days = {};
  stats.forEach(function(s){ (days[s.day] = days[s.day] || {})[s.model] = s.input_tokens + s.output_tokens; });
  var dayKeys = Object.keys(days).map(Number).sort(function(a,b){return a-b;});
  var models = [];
  stats.forEach(function(s){ if(models.indexOf(s.model)<0) models.push(s.model); });
  var colors = ["#7c6cf0","#22d3ee","#34d399","#fbbf24","#f87171","#a78bfa","#fb7185","#38bdf8"];
  function color(i){ return colors[i % colors.length]; }
  var max = 1;
  dayKeys.forEach(function(d){ var sum=0; models.forEach(function(m){ sum += (days[d][m]||0); }); if(sum>max)max=sum; });
  var W = 760, H = 260, padL = 56, padB = 26, padT = 12;
  var cw = W - padL, ch = H - padT - padB;
  var bw = Math.min(34, cw / Math.max(dayKeys.length,1) * 0.7);
  var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("width","100%"); svg.setAttribute("height",H);
  for(var g=0; g<=4; g++){
    var y = padT + ch - (ch*g/4);
    var line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",padL); line.setAttribute("x2",W); line.setAttribute("y1",y); line.setAttribute("y2",y);
    line.setAttribute("stroke","#2c2c38"); line.setAttribute("stroke-width","1");
    svg.appendChild(line);
    var lab = document.createElementNS("http://www.w3.org/2000/svg","text");
    lab.setAttribute("x",padL-8); lab.setAttribute("y",y+4); lab.setAttribute("text-anchor","end");
    lab.setAttribute("fill","#6b6b80"); lab.setAttribute("font-size","10");
    lab.textContent = fmtNum(max*g/4);
    svg.appendChild(lab);
  }
  var n = dayKeys.length;
  var totalW = n * bw;
  var step = n>1 ? cw/(n-1) : 0;
  dayKeys.forEach(function(d, i){
    var x = n>1 ? padL + i*step : padL + cw/2 - bw/2;
    var yBottom = padT + ch;
    var yTop = yBottom;
    models.forEach(function(m, mi){
      var v = days[d][m]||0;
      if(!v) return;
      var h = (v/max)*ch;
      var rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x", x); rect.setAttribute("y", yBottom - (yBottom - yTop) - h);
      rect.setAttribute("width", bw); rect.setAttribute("height", h);
      rect.setAttribute("fill", color(mi)); rect.setAttribute("rx","2");
      svg.appendChild(rect);
      yTop = yBottom - (yBottom - yTop) - h;
    });
    if(n<=16 || i%Math.ceil(n/14)===0){
      var lab = document.createElementNS("http://www.w3.org/2000/svg","text");
      lab.setAttribute("x", x + bw/2); lab.setAttribute("y", H-8); lab.setAttribute("text-anchor","middle");
      lab.setAttribute("fill","#6b6b80"); lab.setAttribute("font-size","10");
      lab.textContent = fmtDate(d).slice(5);
      svg.appendChild(lab);
    }
  });
  var wrap = el("div","chart-wrap");
  wrap.appendChild(svg);
  var legend = el("div","legend");
  models.forEach(function(m, i){
    var s = el("span");
    var dot = el("i"); dot.style.background = color(i);
    s.appendChild(dot);
    s.appendChild(document.createTextNode(m));
    legend.appendChild(s);
  });
  wrap.appendChild(legend);
  return wrap;
}
function fmtNum(v){
  if(v>=1000000000) return (v/1000000000).toFixed(1)+"B";
  if(v>=1000000) return (v/1000000).toFixed(1)+"M";
  if(v>=1000) return (v/1000).toFixed(1)+"k";
  return String(Math.round(v));
}
