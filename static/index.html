<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrighTO Router</title>
<style>
:root{
  --bg1:#08111f; --bg2:#111827; --panel:#0f172a; --sidebar:#0b1220; --card:#111c31;
  --border:#26364f; --border2:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --faint:#64748b; --accent-text:#7dd3fc;
  --sky:#38bdf8; --violet:#8b5cf6; --primary:#1d4ed8; --primary2:#1e40af;
  --green:#22c55e; --amber:#f59e0b; --red:#f87171; --cyan:#22d3ee;
  --radius:18px; --radius-lg:26px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html[data-font=small]{zoom:.9}
html[data-font=large]{zoom:1.1}
html[data-density=compact] th,html[data-density=compact] td{padding:4px 10px}
html[data-density=compact] .panel{padding:14px;margin-bottom:14px}
html[data-density=compact] .card .big{font-size:25px}
html[data-density=compact] .topbar h2{font-size:22px}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
code{font-family:var(--mono);background:rgba(30,41,59,.6);padding:2px 7px;border-radius:6px;font-size:12px;color:var(--accent-text)}

/* ---------- Login ---------- */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#login-view::before,#login-view::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none}
#login-view::before{width:520px;height:520px;background:#2563eb;top:-120px;right:-100px}
#login-view::after{width:480px;height:480px;background:#14b8a6;bottom:-140px;left:-120px;opacity:.2}
.login-card{position:relative;width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:24px;padding:38px 34px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--sky),var(--violet));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;color:#fff;flex:0 0 auto}
.brand h1{font-size:21px;margin:0;letter-spacing:-.02em;font-weight:800}
.brand .sub{font-size:12px;color:var(--accent-text);font-weight:600}
.subtitle{color:var(--muted);margin:0 0 24px;font-size:13.5px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;background:#111827;border:1px solid var(--border2);border-radius:10px;color:var(--text);
  padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
textarea{resize:vertical;min-height:72px}
.seg{display:flex;gap:6px;background:#111827;border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
.seg button.active{background:var(--primary);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border2);
  background:#111827;color:var(--text);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--sky);color:#fff}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary2)}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.icon-btn{padding:5px 8px;line-height:0;display:inline-flex;align-items:center;justify-content:center}
.muted{color:var(--muted)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.linkbtn{background:none;border:none;color:var(--accent-text);cursor:pointer;font-size:13px;padding:0;font-weight:600}
.linkbtn:hover{text-decoration:underline}

/* ---------- App shell ---------- */
#app-view{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);border-right:1px solid var(--border);padding:22px 14px;
  display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;flex:0 0 auto}
.sidebar .brand{padding:0 10px 18px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-direction:column;align-items:flex-start;gap:2px}
.sidebar .brand .row{display:flex;align-items:center;gap:10px}
.sidebar .brand h1{font-size:19px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px;color:var(--muted);
  cursor:pointer;font-size:13.5px;font-weight:600;border:none;background:none;width:100%;text-align:left;transition:.12s}
.nav:hover{background:#111827;color:var(--text)}
.nav.active{background:var(--primary);color:#fff}
.nav svg{width:17px;height:17px;flex:0 0 auto}
.sidebar .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.mode-pill{font-size:11px;color:var(--muted);background:#111827;border:1px solid var(--border);border-radius:99px;
  padding:4px 11px;text-align:center;text-transform:uppercase;letter-spacing:.05em;font-weight:700}

.main{flex:1;padding:30px 38px;max-width:1260px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:14px;flex-wrap:wrap}
.topbar h2{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:850}
.topbar .desc{color:var(--muted);font-size:13.5px;margin-top:3px}
.verified{display:inline-flex;align-items:center;gap:8px;background:#111827;border:1px solid var(--border);
  border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--text)}
.verified .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- Cards / panels ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px}
.card .label{color:var(--muted);font-size:12px;font-weight:700}
.card .big{font-size:30px;font-weight:850;letter-spacing:-.02em;margin-top:6px}
.card .foot{color:var(--muted);font-size:12px;margin-top:3px}
.card .foot b{font-weight:800}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px}
.panel h3{margin:0 0 5px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.panel-head h3{margin:0}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#0b1220;contain:layout}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#111827;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#111c31}
td.actions{white-space:nowrap}
tbody tr:hover td.actions{background:#111c31}
td.mono{font-family:var(--mono);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
.icon-btn{padding:3px 6px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
table.models-table{min-width:1350px}
table.conn-table{min-width:900px}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill .dot{width:6px;height:6px;border-radius:50%}
.pill.on{background:rgba(34,197,94,.14);color:var(--green)} .pill.on .dot{background:var(--green)}
.pill.off{background:rgba(248,113,113,.14);color:var(--red)} .pill.off .dot{background:var(--red)}
.pill.warn{background:rgba(245,158,11,.14);color:var(--amber)} .pill.warn .dot{background:var(--amber)}
.pill.info{background:rgba(56,189,248,.14);color:var(--sky)} .pill.info .dot{background:var(--sky)}

/* ---------- Modal ---------- */
#modal-overlay{position:fixed;inset:0;background:rgba(2,6,18,.68);display:flex;align-items:flex-start;justify-content:center;
  padding:42px 20px;z-index:50;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:20px;width:100%;max-width:580px;
  padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{margin:0 0 16px;font-size:18px;font-weight:800}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:flex;align-items:center;gap:7px;background:#111827;border:1px solid var(--border2);border-radius:99px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--text);font-weight:600}
.chip.selected{border-color:var(--sky);background:rgba(56,189,248,.12);color:var(--accent-text)}
.chip input{margin:0;accent-color:var(--sky)}

/* ---------- Toast ---------- */
#toast{position:fixed;top:70px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{background:#111827;border:1px solid var(--border);border-left:3px solid var(--sky);border-radius:10px;pointer-events:auto;
  padding:13px 17px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);max-width:380px}
.toast.ok{border-left-color:var(--green)} .toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Charts ---------- */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.empty{color:var(--faint);text-align:center;padding:40px 16px;font-size:13px}
.empty svg{width:36px;height:36px;margin-bottom:8px;opacity:.4}
.launch-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.launch-step{background:#0b1220;border:1px solid var(--border);border-radius:14px;padding:14px}
.launch-step .num{width:24px;height:24px;border-radius:50%;background:rgba(56,189,248,.14);color:var(--accent-text);display:inline-flex;align-items:center;justify-content:center;font-weight:850;margin-bottom:8px;text-align:center}
.launch-step b{display:block;margin-bottom:4px}
.launch-step span{color:var(--muted);font-size:12.5px}
.launch-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.key-reveal{background:#0b1220;border:1px dashed var(--sky);border-radius:12px;padding:15px;margin:14px 0;
  font-family:var(--mono);font-size:14px;word-break:break-all;color:var(--accent-text);display:flex;align-items:center;justify-content:space-between;gap:10px}
.warn-note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:var(--amber);border-radius:9px;
  padding:10px 13px;font-size:12px;margin:10px 0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)} .kv .v{font-weight:600}
.hamburger{display:none}
@media(max-width:820px){
  .hamburger{display:inline-flex}
  .sidebar{position:fixed;z-index:40;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none}
  .main{padding:18px 16px;max-width:none;width:100%}
  .topbar{flex-direction:column;align-items:flex-start;margin-bottom:16px}
  .topbar h2{font-size:24px}
  .grid{grid-template-columns:1fr;gap:10px;margin-bottom:14px}
  .card{padding:15px 16px;border-radius:16px}
  .panel{padding:16px;border-radius:18px;margin-bottom:14px}
  .panel-head{align-items:stretch}
  .panel-head>select{max-width:none!important;flex:1 1 100%}
  .table-wrap{overflow:visible;border:none;background:transparent}
  .table-wrap table{display:block;width:100%;min-width:0!important;border-collapse:separate;border-spacing:0}
  .table-wrap thead{display:none}
  .table-wrap tbody{display:grid;gap:10px}
  .table-wrap tr{display:block;background:#0b1220;border:1px solid var(--border);border-radius:14px;padding:8px 12px;box-shadow:0 10px 24px rgba(0,0,0,.16)}
  .table-wrap tr:hover{background:#0b1220}
  .table-wrap td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0!important;border-bottom:1px solid var(--border);white-space:normal;text-align:right;min-width:0}
  .table-wrap td:last-child{border-bottom:none}
  .table-wrap td::before{content:attr(data-label);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;flex:0 0 112px;text-align:left}
  .table-wrap td[data-label=""]::before{display:none}
  .table-wrap td.actions{display:block;text-align:left}
  .table-wrap td.actions .row{justify-content:flex-start;flex-wrap:wrap!important;gap:7px!important}
  .table-wrap td.mono,.table-wrap td .mono{word-break:break-word;overflow-wrap:anywhere}
  .table-wrap .truncate{white-space:normal;overflow-wrap:anywhere;text-align:right}
  .table-wrap .pill{text-align:left;justify-content:flex-start}
  .key-reveal{display:block}
  .key-reveal .btn{margin-top:10px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view">
  <div class="login-card">
    <div class="brand">
      <div class="logo">B</div>
      <div><h1>BrighTO</h1><div class="sub">Router</div></div>
    </div>
    <p class="subtitle" id="login-sub">Sign in to manage your LLM gateway.</p>
    <div class="seg">
      <button id="seg-admin" class="active" onclick="setMode('admin')">Admin</button>
      <button id="seg-user" onclick="setMode('user')">User</button>
    </div>
    <div id="admin-fields">
      <div class="field"><label>Username</label><input id="login-user" value="admin" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="login-pass" type="password" placeholder="ADMIN_MASTER_KEY" autocomplete="current-password"></div>
    </div>
    <div class="field hidden" id="user-field"><label>API key</label><input id="login-apikey" type="password" placeholder="lc-..." autocomplete="off"></div>
    <button class="btn primary btn-block" onclick="login()">Sign in</button>
    <div class="warn-note hidden" id="login-error"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-view" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="row"><div class="logo">B</div><h1>BrighTO</h1></div>
      <div class="sub" id="sidebar-sub">Admin Portal</div>
    </div>
    <button class="nav active" data-view="dashboard" onclick="go('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></svg>Dashboard</button>
    <button class="nav" data-view="providers" onclick="go('providers')" id="nav-providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Providers</button>
    <button class="nav" data-view="models" onclick="go('models')" id="nav-models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5-9 5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/></svg>Models &amp; Routes</button>
    <button class="nav" data-view="teams" onclick="go('teams')" id="nav-teams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Teams</button>
    <button class="nav" data-view="keys" onclick="go('keys')" id="nav-keys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zM15 6l3 3m-1-4l3 3"/></svg>API Keys</button>
    <button class="nav" data-view="usage" onclick="go('usage')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-7"/></svg>Usage</button>
    <button class="nav" data-view="settings" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</button>
    <div class="foot">
      <div class="mode-pill" id="mode-pill">Admin</div>
      <button class="btn ghost sm" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn sm ghost hamburger" onclick="toggleSidebar()">☰</button>
      <div><h2 id="page-title">Dashboard</h2><div class="desc" id="page-desc"></div></div>
      <div class="verified"><span class="dot"></span><span id="verified-label">Admin key verified</span></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="modal-overlay" class="hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
"use strict";
var mode = "admin";
var authKey = "";
var backends = [], routes = [], teams = [], keys = [], catalog = [];

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; }
function fmt(n){ if(n===null||n===undefined)return "-"; n=Number(n); var a=Math.abs(n),s; if(a>=1e9)s=(n/1e9).toFixed(1)+"B"; else if(a>=1e6)s=(n/1e6).toFixed(1)+"M"; else if(a>=1e3)s=(n/1e3).toFixed(1)+"K"; else return String(Math.round(n)); return s.replace(/\.0([KMB])$/,"$1"); }
function fmtCount(n){ return fmt(n); }
function fmtTs(sec){ if(!sec)return "-"; var d=new Date(sec*1000); return d.toISOString().replace("T"," ").slice(0,16); }
function fmtDate(sec){ return new Date(sec*1000).toISOString().slice(0,10); }
function authHeaders(){
  if(mode==="admin") return {"Content-Type":"application/json","x-admin-key":authKey};
  return {"Content-Type":"application/json","Authorization":"Bearer "+authKey};
}
async function api(path, method, body){
  var res = await fetch(path, {method:method, headers:authHeaders(), body:body?JSON.stringify(body):undefined});
  if(!res.ok){ var t=await res.text(); var m=t; try{var j=JSON.parse(t); if(j.error)m=j.error.message||j.error;}catch(e){}
    throw new Error(res.status+" "+m); }
  if(res.status===204) return null;
  return res.json();
}
function toast(msg, type){ var b=$("toast"); var t=el("div","toast "+(type||""),msg); b.appendChild(t); setTimeout(function(){t.remove();},4000); }

/* ===== Auth ===== */
function setMode(m){
  mode=m;
  $("seg-admin").classList.toggle("active",m==="admin");
  $("seg-user").classList.toggle("active",m==="user");
  $("admin-fields").classList.toggle("hidden",m!=="admin");

var SESSION_KEY="brigto_session_v1";
var SESSION_TTL_MS=12*3600*1000; // 12h
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({mode:mode, key:authKey, ts:Date.now()})); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
// F5 refresh: khôi phục phiên đã lưu (TTL 12h) và verify lại bằng API trước khi hiện app.
async function restoreSession(){
  var raw=null; try{ raw=localStorage.getItem(SESSION_KEY); }catch(e){}
  if(!raw) return false;
  var s=null; try{ s=JSON.parse(raw); }catch(e){ return false; }
  if(!s || !s.key || !s.mode) return false;
  if(Date.now()-s.ts > SESSION_TTL_MS){ clearSession(); return false; }
  mode=s.mode; authKey=s.key; setMode(mode);
  try{
    if(mode==="admin"){ await api("/admin/backends","GET"); }
    else { await api("/portal/me","GET"); }
  }catch(e){ authKey=""; clearSession(); return false; }
  enterApp();
  await refresh();
  return true;
}

  var outT=sum?sum.totals.output_tokens:stats.reduce(function(a,s){return a+s.output_tokens},0);

  }

    ["Requests (30d)", fmt(req), "completed"],
    ["Total tokens", fmt(inT+outT), "in "+fmt(inT)+" / out "+fmt(outT)],
    ["Estimated cost", fmtCost(cost), pricedReqs?(pricedReqs+" priced requests"):"configure route prices"],

  }

    var kv=el("div","kv");

/* ===== Charts ===== */
function chartBars(stats){
  var days={}; stats.forEach(function(s){(days[s.day]=days[s.day]||{})[s.model]=s.input_tokens+s.output_tokens;});
  var dk=Object.keys(days).map(Number).sort(function(a,b){return a-b;});
  var models=[]; stats.forEach(function(s){if(models.indexOf(s.model)<0)models.push(s.model);});
  var colors=["#38bdf8","#8b5cf6","#22d3ee","#34d399","#fbbf24","#f87171","#a78bfa","#818cf8"];
  function color(i){return colors[i%colors.length];}
  var max=1; dk.forEach(function(d){var s=0;models.forEach(function(m){s+=(days[d][m]||0);});if(s>max)max=s;});
  var W=780,H=250,padL=52,padB=26,padT=12,cw=W-padL,ch=H-padT-padB,bw=Math.min(34,cw/Math.max(dk.length,1)*0.7);
  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("width","100%"); svg.setAttribute("height",H);
  for(var g=0;g<=4;g++){ var y=padT+ch-(ch*g/4);
    var ln=document.createElementNS("http://www.w3.org/2000/svg","line"); ln.setAttribute("x1",padL);ln.setAttribute("x2",W);ln.setAttribute("y1",y);ln.setAttribute("y2",y);ln.setAttribute("stroke","#26364f");ln.setAttribute("stroke-width","1");svg.appendChild(ln);
    var lb=document.createElementNS("http://www.w3.org/2000/svg","text");lb.setAttribute("x",padL-8);lb.setAttribute("y",y+4);lb.setAttribute("text-anchor","end");lb.setAttribute("fill","#64748b");lb.setAttribute("font-size","10");lb.textContent=fmtNum(max*g/4);svg.appendChild(lb);
  }
  var n=dk.length,step=n>1?cw/(n-1):0;
  dk.forEach(function(d,i){ var x=n>1?padL+i*step:padL+cw/2-bw/2,yB=padT+ch,yT=yB;
    models.forEach(function(m,mi){ var v=days[d][m]||0; if(!v)return; var hh=(v/max)*ch;
      var rc=document.createElementNS("http://www.w3.org/2000/svg","rect");rc.setAttribute("x",x);rc.setAttribute("y",yB-(yB-yT)-hh);rc.setAttribute("width",bw);rc.setAttribute("height",hh);rc.setAttribute("fill",color(mi));rc.setAttribute("rx","2");svg.appendChild(rc);yT=yB-(yB-yT)-hh; });
    if(n<=16||i%Math.ceil(n/14)===0){ var lb=document.createElementNS("http://www.w3.org/2000/svg","text");lb.setAttribute("x",x+bw/2);lb.setAttribute("y",H-8);lb.setAttribute("text-anchor","middle");lb.setAttribute("fill","#64748b");lb.setAttribute("font-size","10");lb.textContent=fmtDate(d).slice(5);svg.appendChild(lb); }
  });
  var wrap=el("div","chart-wrap"); wrap.appendChild(svg);
  var lg=el("div","legend");
  models.forEach(function(m,i){ var s=el("span"); var dot=el("i");dot.style.background=color(i); s.appendChild(dot); s.appendChild(document.createTextNode(m)); lg.appendChild(s); });
  wrap.appendChild(lg);
  return wrap;
}
function fmtNum(v){ return fmt(v); }

function keyPrefix(id){ var k=(typeof keys!=="undefined"&&keys)?keys.find(function(x){return x.id===id}):null; return k?k.prefix:String(id); }
function fmtCost(v){ if(v==null) return "—"; if(v===0) return "$0.00"; if(v<1) return "$"+v.toFixed(4); return "$"+v.toFixed(2); }
function fmtDur(ms){ if(ms==null || ms<0) return "—"; if(ms<1000) return Math.round(ms)+" ms"; var s=ms/1000; if(s<60) return s.toFixed(1)+" s"; var m=Math.floor(s/60); var rem=Math.round(s%60); return m+"m "+rem+"s"; }
function copyIconBtn(text){ var b=el("button","btn sm ghost icon-btn"); b.title="Copy"; b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'; b.onclick=function(){navigator.clipboard.writeText(text).then(function(){toast("Copied");});}; return b; }
function protoLabel(p){ var m={"openai_chat":"OpenAI Chat","openai_completions":"Completions","openai_embeddings":"Embeddings","anthropic_messages":"Anthropic Messages","local_openai_chat":"Local Chat","custom_openai_chat":"Custom"}; return m[p]||p||"openai_chat"; }

function isLocalUrl(u){ var h=(u||"").toLowerCase(); h=h.split("://")[1]||h; h=h.split("/")[0].split(":")[0]; return h==="127.0.0.1"||h==="localhost"||h==="::1"||h.startsWith("10.")||h.startsWith("192.168.")||h.startsWith("172.16.")||h.startsWith("172.17.")||h.startsWith("172.18.")||h.startsWith("172.19.")||/^172\.(2[0-9]|3[0-1])\./.test(h); }

function logsTable(rows){
  var w=el("div","table-wrap"); var t=el("table");
  var admin=mode==="admin";
  t.appendChild(thead(admin
    ? ["Time","Team","Key","Model","Status","In / Out","Tok/s","Cost","Router","Duration","Error"]
    : ["Time","Model","Status","In / Out","Tok/s","Cost","Duration","Error"]));
  var tb=el("tbody");
  if(!rows.length){ w.appendChild(emptyBox("No requests logged yet.")); return w; }
  rows.slice(0,200).forEach(function(r){
    var tr=el("tr");
    tr.appendChild(el("td","mono",fmtTs(r.ts)));
    if(admin){
      tr.appendChild(el("td",null,String(r.team_id)));

    if(admin) tr.appendChild(el("td",null,r.error_class||""));

/* ===== shared ===== */
function thead(cols){ var tr=el("tr"); cols.forEach(function(h){tr.appendChild(el("th",null,h));}); var th=document.createElement("thead"); th.appendChild(tr); return th; }
function decorateTables(){
  document.querySelectorAll("#content table").forEach(function(t){
    var heads=[].slice.call(t.querySelectorAll("thead th")).map(function(th){return (th.textContent||"").trim();});
    [].slice.call(t.querySelectorAll("tbody tr")).forEach(function(tr){
      [].slice.call(tr.children).forEach(function(td,i){ td.setAttribute("data-label",heads[i]||""); });
    });
  });
}
function pill(text,kind){ var p=el("span","pill "+kind); var d=el("span","dot"); p.appendChild(d); p.appendChild(document.createTextNode(text)); return p; }
function closeModal(){ $("modal-overlay").classList.add("hidden"); $("modal-overlay").innerHTML=""; }
function toggleSidebar(){ $("sidebar").classList.toggle("open"); }
function applyPrefs(){
  var font=localStorage.getItem("pref_font")||"normal";
  var density=localStorage.getItem("pref_density")||"compact";
  document.documentElement.dataset.font=font;
  document.documentElement.dataset.density=density;
  if(!localStorage.getItem("pref_font")) localStorage.setItem("pref_font","normal");
  if(!localStorage.getItem("pref_density")) localStorage.setItem("pref_density","compact");
}
function setPref(key,value){ localStorage.setItem("pref_"+key,value); applyPrefs(); }

setMode("admin");
applyPrefs();
var contentNode=$("content");
if(contentNode && window.MutationObserver){ new MutationObserver(function(){ decorateTables(); }).observe(contentNode,{childList:true,subtree:true}); }
restoreSession();
