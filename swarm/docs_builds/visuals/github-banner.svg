<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="BrighTO Router GitHub banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.46" stop-color="#101a36"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e4ff"/>
      <stop offset="0.52" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#b56cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.28  0 0 0 0 0.55  0 0 0 0 1  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" rx="0" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <circle cx="1260" cy="90" r="210" fill="#2957ff" opacity="0.16"/>
  <circle cx="1460" cy="320" r="240" fill="#7c3aed" opacity="0.14"/>
  <circle cx="180" cy="360" r="250" fill="#06b6d4" opacity="0.10"/>

  <g transform="translate(965 86)" filter="url(#glow)">
    <rect x="0" y="0" width="440" height="250" rx="28" fill="#0f1b31" stroke="#5b7cfa" stroke-opacity="0.5"/>
    <g stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M74 68 C160 22 280 24 366 70" stroke="#65e4ff"/>
      <path d="M74 182 C160 228 280 226 366 180" stroke="#b56cff"/>
      <path d="M88 126 H350" stroke="url(#blue)"/>
      <path d="M118 82 L88 126 L118 170" stroke="#65e4ff"/>
      <path d="M320 82 L350 126 L320 170" stroke="#b56cff"/>
    </g>
    <g fill="#dbeafe" opacity="0.95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
      <text x="92" y="72">Client SDKs</text>
      <text x="262" y="72">LLM Providers</text>
      <text x="168" y="132">BrighTO</text>
      <text x="174" y="184">PostgreSQL Ledger</text>
    </g>
  </g>

  <g transform="translate(110 86)">
    <rect x="0" y="0" width="176" height="42" rx="21" fill="#12203a" stroke="#65e4ff" stroke-opacity="0.45"/>
    <circle cx="26" cy="21" r="8" fill="#22c55e"/>
    <text x="44" y="27" fill="#bdefff" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Rust router</text>
    <text x="0" y="112" fill="#ffffff" font-size="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="850" letter-spacing="-3">BrighTO-Router</text>
    <text x="2" y="162" fill="#b6c6dd" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif">Fast LLM routing, team budgets, streaming, and usage ledger.</text>
    <g transform="translate(0 208)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750">
      <rect x="0" y="0" width="150" height="44" rx="22" fill="#e0f2fe"/>
      <text x="22" y="29" fill="#075985">PostgreSQL</text>
      <rect x="166" y="0" width="128" height="44" rx="22" fill="#dcfce7"/>
      <text x="194" y="29" fill="#166534">No Redis</text>
      <rect x="310" y="0" width="182" height="44" rx="22" fill="#ede9fe"/>
      <text x="334" y="29" fill="#5b21b6">Docker + K8s</text>
      <rect x="508" y="0" width="210" height="44" rx="22" fill="#fff7ed"/>
      <text x="532" y="29" fill="#9a3412">Transparent bench</text>
    </g>
  </g>
</svg>
