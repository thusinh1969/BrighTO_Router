<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="BrighTO Router admin portal mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1440" height="1000" fill="url(#bg)"/>
  <circle cx="1220" cy="120" r="260" fill="#2563eb" opacity="0.15"/>
  <circle cx="180" cy="860" r="280" fill="#14b8a6" opacity="0.10"/>
  <rect x="48" y="46" width="1344" height="908" rx="34" fill="#0f172a" stroke="#26364f" filter="url(#shadow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="48" y="46" width="250" height="908" rx="34" fill="#0b1220"/>
    <text x="84" y="104" fill="#fff" font-size="28" font-weight="850">BrighTO</text>
    <text x="84" y="132" fill="#7dd3fc" font-size="14" font-weight="700">Admin Portal</text>
    <g fill="#94a3b8" font-size="16" font-weight="700">
      <text x="86" y="204">Dashboard</text>
      <text x="86" y="254">Providers</text>
      <text x="86" y="304">Model routes</text>
      <text x="86" y="354">Teams</text>
      <text x="86" y="404">API keys</text>
      <text x="86" y="454">Usage ledger</text>
      <text x="86" y="504">Settings</text>
    </g>
    <rect x="72" y="226" width="194" height="46" rx="14" fill="#1d4ed8" opacity="0.95"/>
    <text x="86" y="255" fill="#fff" font-size="16" font-weight="850">Providers</text>

    <text x="334" y="102" fill="#fff" font-size="34" font-weight="850" letter-spacing="-1">Provider setup</text>
    <text x="334" y="132" fill="#94a3b8" font-size="16">Connect cloud LLM backends, fetch models, expose approved routes.</text>
    <rect x="1110" y="78" width="220" height="46" rx="23" fill="#111827" stroke="#334155"/>
    <text x="1130" y="107" fill="#cbd5e1" font-size="15" font-weight="700">Admin key verified</text>
    <circle cx="1300" cy="101" r="7" fill="#22c55e"/>

    <g transform="translate(334 172)">
      <rect width="300" height="118" rx="22" fill="#111c31" stroke="#26364f"/>
      <text x="22" y="38" fill="#94a3b8" font-size="14" font-weight="700">Providers</text>
      <text x="22" y="82" fill="#fff" font-size="44" font-weight="850">10</text>
      <text x="92" y="80" fill="#22c55e" font-size="16" font-weight="800">seeded</text>
    </g>
    <g transform="translate(658 172)">
      <rect width="300" height="118" rx="22" fill="#111c31" stroke="#26364f"/>
      <text x="22" y="38" fill="#94a3b8" font-size="14" font-weight="700">Ready keys</text>
      <text x="22" y="82" fill="#fff" font-size="44" font-weight="850">3</text>
      <text x="74" y="80" fill="#f59e0b" font-size="16" font-weight="800">need setup</text>
    </g>
    <g transform="translate(982 172)">
      <rect width="348" height="118" rx="22" fill="#111c31" stroke="#26364f"/>
      <text x="22" y="38" fill="#94a3b8" font-size="14" font-weight="700">Active routes</text>
      <text x="22" y="82" fill="#fff" font-size="44" font-weight="850">7</text>
      <text x="78" y="80" fill="#38bdf8" font-size="16" font-weight="800">across 5 backends</text>
    </g>

    <g transform="translate(334 322)">
      <rect width="996" height="300" rx="24" fill="#0b1220" stroke="#26364f"/>
      <text x="24" y="38" fill="#fff" font-size="22" font-weight="850">Provider backends</text>
      <text x="24" y="64" fill="#94a3b8" font-size="14">Key status is safe: only true/false is shown, never plaintext keys.</text>
      <g transform="translate(24 92)" font-size="14">
        <rect width="948" height="42" rx="12" fill="#111827"/>
        <text x="18" y="27" fill="#94a3b8" font-weight="800">Provider</text><text x="220" y="27" fill="#94a3b8" font-weight="800">Status</text><text x="370" y="27" fill="#94a3b8" font-weight="800">Models</text><text x="520" y="27" fill="#94a3b8" font-weight="800">Base URL</text><text x="825" y="27" fill="#94a3b8" font-weight="800">Action</text>
        <g fill="#e2e8f0">
          <text x="18" y="82" font-weight="800">OpenAI</text><text x="220" y="82" fill="#22c55e" font-weight="800">Enabled · key ready</text><text x="370" y="82">44</text><text x="520" y="82">api.openai.com</text><rect x="815" y="60" width="86" height="34" rx="10" fill="#1d4ed8"/><text x="838" y="82" fill="#fff" font-weight="800">Edit</text>
          <text x="18" y="134" font-weight="800">DeepSeek</text><text x="220" y="134" fill="#22c55e" font-weight="800">Enabled · key ready</text><text x="370" y="134">8</text><text x="520" y="134">api.deepseek.com</text><rect x="815" y="112" width="86" height="34" rx="10" fill="#1d4ed8"/><text x="838" y="134" fill="#fff" font-weight="800">Edit</text>
          <text x="18" y="186" font-weight="800">Anthropic</text><text x="220" y="186" fill="#f59e0b" font-weight="800">Disabled · no key</text><text x="370" y="186">manual</text><text x="520" y="186">api.anthropic.com</text><rect x="815" y="164" width="86" height="34" rx="10" fill="#334155"/><text x="838" y="186" fill="#fff" font-weight="800">Setup</text>
        </g>
      </g>
    </g>

    <g transform="translate(334 650)">
      <rect width="480" height="250" rx="24" fill="#0b1220" stroke="#26364f"/>
      <text x="24" y="40" fill="#fff" font-size="22" font-weight="850">Create model route</text>
      <rect x="24" y="72" width="432" height="46" rx="13" fill="#111827" stroke="#334155"/><text x="42" y="101" fill="#cbd5e1" font-size="15">gpt-4o-mini</text>
      <rect x="24" y="136" width="200" height="46" rx="13" fill="#111827" stroke="#334155"/><text x="42" y="165" fill="#cbd5e1" font-size="15">Backends: 1,2</text>
      <rect x="240" y="136" width="216" height="46" rx="13" fill="#111827" stroke="#334155"/><text x="258" y="165" fill="#cbd5e1" font-size="15">Timeout: 180s</text>
      <rect x="24" y="202" width="180" height="40" rx="13" fill="url(#accent)"/><text x="52" y="228" fill="#fff" font-size="15" font-weight="850">Save route</text>
    </g>

    <g transform="translate(846 650)">
      <rect width="484" height="250" rx="24" fill="#0b1220" stroke="#26364f"/>
      <text x="24" y="40" fill="#fff" font-size="22" font-weight="850">Usage and budget</text>
      <polyline points="30,190 90,160 150,172 210,118 270,134 330,92 430,78" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <polyline points="30,202 90,188 150,194 210,170 270,176 330,150 430,138" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="82" fill="#94a3b8" font-size="14">Requests, tokens, first byte time, total time</text>
      <rect x="30" y="105" width="132" height="32" rx="16" fill="#0f766e"/><text x="50" y="126" fill="#ccfbf1" font-size="13" font-weight="850">Team budget OK</text>
    </g>
  </g>
</svg>
