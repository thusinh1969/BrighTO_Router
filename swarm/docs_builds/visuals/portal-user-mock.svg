<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="BrighTO Router user portal mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1440" height="1000" fill="url(#bg)"/>
  <circle cx="1120" cy="820" r="280" fill="#6366f1" opacity="0.14"/>
  <circle cx="240" cy="140" r="280" fill="#06b6d4" opacity="0.10"/>
  <rect x="54" y="48" width="1332" height="904" rx="34" fill="#0f172a" stroke="#273449" filter="url(#shadow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="54" y="48" width="236" height="904" rx="34" fill="#0b1220"/>
    <text x="88" y="106" fill="#fff" font-size="28" font-weight="850">BrighTO</text>
    <text x="88" y="134" fill="#67e8f9" font-size="14" font-weight="700">User Portal</text>
    <rect x="78" y="184" width="188" height="46" rx="14" fill="#0891b2"/>
    <text x="92" y="213" fill="#fff" font-size="16" font-weight="850">My usage</text>
    <g fill="#94a3b8" font-size="16" font-weight="700">
      <text x="92" y="272">My API key</text>
      <text x="92" y="322">Allowed models</text>
      <text x="92" y="372">Request logs</text>
      <text x="92" y="422">Budget</text>
      <text x="92" y="472">Examples</text>
    </g>

    <text x="332" y="104" fill="#fff" font-size="34" font-weight="850" letter-spacing="-1">My LLM gateway</text>
    <text x="332" y="134" fill="#94a3b8" font-size="16">One team API key, approved models, live usage, clear budget status.</text>
    <rect x="1108" y="78" width="226" height="46" rx="23" fill="#111827" stroke="#334155"/>
    <text x="1128" y="107" fill="#cbd5e1" font-size="15" font-weight="700">API key verified</text>
    <circle cx="1296" cy="101" r="7" fill="#22c55e"/>

    <g transform="translate(332 174)">
      <rect width="312" height="130" rx="24" fill="#111c31" stroke="#26364f"/>
      <text x="24" y="40" fill="#94a3b8" font-size="14" font-weight="800">Today</text>
      <text x="24" y="88" fill="#fff" font-size="46" font-weight="850">128k</text>
      <text x="158" y="86" fill="#22c55e" font-size="16" font-weight="850">tokens used</text>
    </g>
    <g transform="translate(672 174)">
      <rect width="312" height="130" rx="24" fill="#111c31" stroke="#26364f"/>
      <text x="24" y="40" fill="#94a3b8" font-size="14" font-weight="800">Budget left</text>
      <text x="24" y="88" fill="#fff" font-size="46" font-weight="850">872k</text>
      <text x="168" y="86" fill="#38bdf8" font-size="16" font-weight="850">this month</text>
    </g>
    <g transform="translate(1012 174)">
      <rect width="322" height="130" rx="24" fill="#111c31" stroke="#26364f"/>
      <text x="24" y="40" fill="#94a3b8" font-size="14" font-weight="800">Allowed models</text>
      <text x="24" y="88" fill="#fff" font-size="46" font-weight="850">6</text>
      <text x="80" y="86" fill="#a78bfa" font-size="16" font-weight="850">team-approved</text>
    </g>

    <g transform="translate(332 338)">
      <rect width="628" height="294" rx="24" fill="#0b1220" stroke="#26364f"/>
      <text x="24" y="42" fill="#fff" font-size="22" font-weight="850">Token usage</text>
      <text x="24" y="68" fill="#94a3b8" font-size="14">Input and output tokens by day.</text>
      <line x1="44" y1="230" x2="574" y2="230" stroke="#334155"/>
      <line x1="44" y1="112" x2="574" y2="112" stroke="#1f2937"/>
      <polyline points="56,218 126,190 196,198 266,154 336,172 406,126 476,132 554,94" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <polyline points="56,228 126,216 196,220 266,194 336,202 406,172 476,168 554,150" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
      <rect x="46" y="250" width="14" height="14" rx="7" fill="#22d3ee"/><text x="68" y="262" fill="#cbd5e1" font-size="13">Input tokens</text>
      <rect x="174" y="250" width="14" height="14" rx="7" fill="#8b5cf6"/><text x="196" y="262" fill="#cbd5e1" font-size="13">Output tokens</text>
    </g>

    <g transform="translate(990 338)">
      <rect width="344" height="294" rx="24" fill="#0b1220" stroke="#26364f"/>
      <text x="24" y="42" fill="#fff" font-size="22" font-weight="850">Use this endpoint</text>
      <rect x="24" y="76" width="296" height="156" rx="16" fill="#020617" stroke="#1f2937"/>
      <text x="42" y="112" fill="#94a3b8" font-size="14">base_url</text>
      <text x="42" y="140" fill="#e0f2fe" font-size="15">http://server:18080/v1</text>
      <text x="42" y="178" fill="#94a3b8" font-size="14">api_key</text>
      <text x="42" y="206" fill="#e0f2fe" font-size="15">lc-••••••••••••</text>
      <rect x="24" y="248" width="170" height="38" rx="12" fill="url(#accent)"/><text x="48" y="272" fill="#fff" font-size="14" font-weight="850">Copy example</text>
    </g>

    <g transform="translate(332 666)">
      <rect width="1002" height="228" rx="24" fill="#0b1220" stroke="#26364f"/>
      <text x="24" y="42" fill="#fff" font-size="22" font-weight="850">Recent requests</text>
      <g transform="translate(24 72)" font-size="14">
        <rect width="954" height="42" rx="12" fill="#111827"/>
        <text x="18" y="27" fill="#94a3b8" font-weight="850">Time</text><text x="166" y="27" fill="#94a3b8" font-weight="850">Model</text><text x="380" y="27" fill="#94a3b8" font-weight="850">Status</text><text x="520" y="27" fill="#94a3b8" font-weight="850">Tokens</text><text x="700" y="27" fill="#94a3b8" font-weight="850">Latency</text>
        <g fill="#e2e8f0">
          <text x="18" y="82">10:24</text><text x="166" y="82" font-weight="800">gpt-4o-mini</text><text x="380" y="82" fill="#22c55e" font-weight="800">200 OK</text><text x="520" y="82">4,420 in · 812 out</text><text x="700" y="82">first byte 210 ms</text>
          <text x="18" y="132">10:22</text><text x="166" y="132" font-weight="800">deepseek-chat</text><text x="380" y="132" fill="#22c55e" font-weight="800">200 OK</text><text x="520" y="132">12,004 in · 1,420 out</text><text x="700" y="132">first byte 340 ms</text>
        </g>
      </g>
    </g>
  </g>
