<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="BrighTO Router benchmark strategy visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="92" y="96" fill="#0f172a" font-size="52" font-weight="900" letter-spacing="-2">Benchmark strategy: measure router overhead honestly</text>
    <text x="96" y="138" fill="#475569" font-size="22">Same machine, same mock backend, same payload, direct path vs router path.</text>

    <g transform="translate(92 188)" filter="url(#shadow)">
      <rect width="1416" height="174" rx="28" fill="#fff"/>
      <text x="34" y="46" fill="#0f172a" font-size="24" font-weight="900">What we measure</text>
      <g font-size="18" font-weight="750">
        <rect x="34" y="76" width="236" height="54" rx="18" fill="#dbeafe"/><text x="58" y="110" fill="#1e40af">Router overhead</text>
        <rect x="296" y="76" width="236" height="54" rx="18" fill="#dcfce7"/><text x="326" y="110" fill="#166534">First byte time</text>
        <rect x="558" y="76" width="236" height="54" rx="18" fill="#ede9fe"/><text x="596" y="110" fill="#5b21b6">Throughput</text>
        <rect x="820" y="76" width="236" height="54" rx="18" fill="#ffedd5"/><text x="852" y="110" fill="#9a3412">Ledger lag</text>
        <rect x="1082" y="76" width="236" height="54" rx="18" fill="#f1f5f9"/><text x="1118" y="110" fill="#334155">Memory use</text>
      </g>
    </g>

    <g transform="translate(92 404)" filter="url(#shadow)">
      <rect width="720" height="350" rx="28" fill="#fff"/>
      <text x="34" y="48" fill="#0f172a" font-size="24" font-weight="900">Payload sizes</text>
      <text x="34" y="82" fill="#64748b" font-size="17">The router should not get slower just because a prompt is huge.</text>
      <g transform="translate(44 122)" font-size="17" font-weight="800">
        <rect x="0" y="0" width="92" height="46" rx="16" fill="#dbeafe"/><text x="28" y="30" fill="#1d4ed8">1k</text><text x="120" y="30" fill="#334155">normal chat and app traffic</text>
        <rect x="0" y="60" width="150" height="46" rx="16" fill="#bfdbfe"/><text x="28" y="90" fill="#1d4ed8">50k</text><text x="178" y="90" fill="#334155">retrieval and agent prompts</text>
        <rect x="0" y="120" width="236" height="46" rx="16" fill="#93c5fd"/><text x="28" y="150" fill="#0f3e99">200k</text><text x="264" y="150" fill="#334155">large research prompts</text>
        <rect x="0" y="180" width="326" height="46" rx="16" fill="#60a5fa"/><text x="28" y="210" fill="#082f6e">500k</text><text x="354" y="210" fill="#334155">stress proof</text>
        <rect x="0" y="240" width="430" height="46" rx="16" fill="#3b82f6"/><text x="28" y="270" fill="#eff6ff">1M</text><text x="458" y="270" fill="#334155">capacity proof on big server</text>
      </g>
    </g>

    <g transform="translate(852 404)" filter="url(#shadow)">
      <rect width="656" height="350" rx="28" fill="#fff"/>
      <text x="34" y="48" fill="#0f172a" font-size="24" font-weight="900">Concurrency levels</text>
      <text x="34" y="82" fill="#64748b" font-size="17">Concurrency means how many requests are in flight at the same time.</text>
      <g transform="translate(44 130)">
        <circle cx="72" cy="72" r="58" fill="#dbeafe"/><text x="54" y="84" fill="#1d4ed8" font-size="36" font-weight="900">1</text><text x="150" y="62" fill="#0f172a" font-size="20" font-weight="900">Latency floor</text><text x="150" y="91" fill="#64748b" font-size="16">One user, no queue pressure.</text>
        <circle cx="72" cy="178" r="58" fill="#dcfce7"/><text x="42" y="190" fill="#166534" font-size="36" font-weight="900">50</text><text x="150" y="168" fill="#0f172a" font-size="20" font-weight="900">Team stress</text><text x="150" y="197" fill="#64748b" font-size="16">Realistic load for about 100 people.</text>
        <circle cx="420" cy="178" r="58" fill="#ffedd5"/><text x="378" y="190" fill="#9a3412" font-size="36" font-weight="900">200</text><text x="498" y="168" fill="#0f172a" font-size="20" font-weight="900">Capacity signal</text><text x="498" y="197" fill="#64748b" font-size="16">Shows overload behavior early.</text>
      </g>
    </g>

    <g transform="translate(92 798)" filter="url(#shadow)">
      <rect width="1416" height="128" rx="28" fill="#0f172a"/>
      <text x="34" y="44" fill="#fff" font-size="24" font-weight="900">Production meaning</text>
      <text x="34" y="82" fill="#cbd5e1" font-size="18">For a team of 100 people and 5 LLM backends, BrighTO must route, enforce budgets, stream fast, and write usage without becoming the bottleneck.</text>
      <rect x="1176" y="34" width="198" height="60" rx="22" fill="url(#accent)"/><text x="1208" y="72" fill="#fff" font-size="18" font-weight="900">No fake targets</text>
    </g>
  </g>
</svg>
