[package]
name = "brighto-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"          # MSRV = MSRV của sqlx 0.9
license = "Apache-2.0"
publish = false

[dependencies]
# --- runtime & HTTP ---
tokio       = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "fs"] }
tokio-util  = { version = "0.7.19", features = ["io"] }
axum        = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path", "tracing"] }
axum-server = { version = "0.8.0" }                      # graceful shutdown; bật tính năng "tls-rustls" nếu muốn TLS trong binary
tower       = { version = "0.5.3", features = ["util", "timeout", "limit"] }
tower-http  = { version = "0.7.1", features = ["trace", "request-id", "set-header", "limit", "timeout"] }
http        = "1.5.0"
http-body   = "1.0.1"
bytes       = "1.12.1"
futures     = "0.3.34"

# --- HTTP client tới backend (vLLM / llama-server / Anthropic) ---
# default-features=false: tắt native-tls (openssl). "rustls" của reqwest 0.13 = aws-lc-rs.
# Không bật gzip auto-decode trong proxy: request tới backend ép Accept-Encoding: identity để giữ body/header pass-through và tránh CPU giải nén.
# KHÔNG bật thêm feature ring ở bất kỳ crate nào: hai crypto provider cùng lúc → rustls panic lúc chạy.
reqwest     = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }

# --- JSON: chỉ deserialize struct nhỏ (model, stream, usage), không bao giờ parse cả messages ---
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = { version = "1.0.151", features = ["raw_value"] }
memchr      = "2.8.3"                                    # tìm "usage" trong chunk trước khi parse

# --- trạng thái trong RAM ---
arc-swap    = "1.9.2"                                    # snapshot config, đổi không lock
dashmap     = "6.2.1"                                    # counter inflight per backend (local từng instance)
# (Redis KHÔNG có trong default profile — fastest profile dùng counter RAM per-instance.
#  Khi cần strict global quota multi-instance, thêm redis feature riêng sau benchmark chứng minh cần.)

# --- DB: config + ledger (production = PostgreSQL ONLY; bỏ any/sqlite để typing rõ ràng) ---
# tls-rustls-aws-lc-rs để CÙNG provider với reqwest (xem chú thích ở reqwest).
# macros + migrate chỉ để chạy #[sqlx::test(migrations = "migrations")] trong test.
sqlx        = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate"] }

# --- observability ---
tracing             = "0.1.44"
tracing-subscriber  = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }   # tự phục vụ /metrics qua axum, không cần http-listener riêng

# --- tiện ích ---
sha2        = "0.11.0"                                   # băm API key
hex         = "0.4.3"
uuid        = { version = "1.26.1", features = ["v7", "serde"] }   # request_id sắp xếp theo thời gian
chrono      = { version = "0.4.45", features = ["serde", "clock"] }
rand        = "0.10.2"                                   # API mới: rand::rng(), .random_range(..)
anyhow      = "1.0.104"
thiserror   = "2.0.20"
clap        = { version = "4.6.7", features = ["derive", "env"] }
dotenvy     = "0.15.7"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

# Mock upstream cho tầng A/B/E của BENCHMARK.md (trả lời ~0ms, không che overhead router).
[[bin]]
name = "brighto-router-mock"
path = "src/bin/mock_upstream.rs"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = "line-tables-only"   # đủ để đọc backtrace production, không phình binary
strip         = false

[profile.dev]
opt-level = 1                        # dev vẫn phải chạy được payload 200K mà không rùa
