apiVersion: apps/v1
kind: Deployment
metadata:
  name: brighto-router
  labels:
    app.kubernetes.io/name: brighto-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brighto-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brighto-router
    spec:
      containers:
        - name: router
          image: thusinh1969/brighto_airouter:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: brighto-router-config
            - secretRef:
                name: brighto-router-secret
          volumeMounts:
            - name: router-data
              mountPath: /var/lib/brighto-router
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: router-data
          emptyDir: {}
