apiVersion: v1
kind: ConfigMap
metadata:
  name: brighto-router-config
data:
  LISTEN_ADDR: "0.0.0.0:8080"
  ADMIN_ALLOW_CIDR: "10.0.0.0/8,127.0.0.1/32"
